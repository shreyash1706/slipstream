<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Streamer MVP</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; }
        video { width: 100%; max-width: 600px; background: #000; border: 1px solid #333; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 15px; margin-right: 10px; cursor: pointer; }
	/* Base Video Styling */
  .player-wrapper video {
    width: 100%;
    max-width: 800px;
    background: #000;
    display: block;
  }

  /* When the wrapper goes into Browser Fullscreen Mode */
  .player-wrapper:fullscreen {
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Force the video to scale up completely while preserving aspect ratio */
  .player-wrapper:fullscreen video {
    max-width: 100vw;
    max-height: 100vh;
    width: 100%;
    height: 100%;
    object-fit: contain; /* Keeps 16:9 gameplay crisp without distortion */
  }

  /* Overlay the header text neatly in the top-left corner during fullscreen */
  .player-wrapper:fullscreen h3 {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 10;
    color: #fff;
    margin: 0;
    background: rgba(0, 0, 0, 0.6);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 14px;
  }

    </style>
</head>
<body>
    <h1>P2P Streamer MVP</h1>
    <div class="controls">
        <button id="start-stream">1. Start Stream (Host)</button>
        <button id="connect-peer">2. Connect (Viewer)</button>
    </div>

    <!-- Local Video Feed Wrapper -->
    <div class="player-wrapper" style="position: relative; display: inline-block; margin-right: 15px;">
        <h3>Local Video Feed</h3>
        <video id="local-video" autoplay playsinline muted></video>
        <button onclick="this.parentElement.requestFullscreen()" 
                style="position: absolute; bottom: 15px; right: 15px; z-index: 10; padding: 8px 12px; background: rgba(0,0,0,0.7); color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer;">
            Fullscreen ⛶
        </button>
    </div>

    <!-- Remote Video Feed Wrapper -->
    <div class="player-wrapper" style="position: relative; display: inline-block;">
        <h3>Remote Video Feed</h3>
        <video id="remote-video" autoplay playsinline></video>
        <button onclick="this.parentElement.requestFullscreen()" 
                style="position: absolute; bottom: 15px; right: 15px; z-index: 10; padding: 8px 12px; background: rgba(0,0,0,0.7); color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer;">
            Fullscreen ⛶
        </button>
    </div>

    <script src="client.js"></script>
</body>
</html>
