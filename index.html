<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Streamer MVP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* Hide scrollbars for clean UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body class="bg-yellow-950 text-gray-100 font-sans antialiased h-screen overflow-hidden select-none">

    <!-- Main Application Scope -->
    <div x-data="meetApp()" class="flex h-full w-full relative">

        <!-- Left/Main Area: Video Stage & Controls -->
        <div class="flex-1 flex flex-col h-full relative overflow-hidden transition-all duration-300">
            
            <!-- Top Header Bar / Room Management -->
            <header class="h-14 border-b border-gray-800 bg-gray-900/50 backdrop-blur px-6 flex items-center justify-between z-10">
                <div class="flex items-center space-x-3">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                    <h1 class="font-bold tracking-wider text-sm uppercase text-gray-300">P2P Mesh Network</h1>
                </div>
                
                <!-- Room Join Controls -->
                <div class="flex items-center space-x-2" x-show="!inRoom">
                    <input type="text" x-model="roomId" placeholder="Enter Room Code..." 
                           class="bg-gray-800 border border-gray-700 px-3 py-1.5 rounded text-sm focus:outline-none focus:border-indigo-500">
                    <button @click="joinRoom()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-1.5 rounded font-medium text-sm transition">
                        Join / Create
                    </button>
                </div>
                <div x-show="inRoom" class="flex items-center space-x-4">
                    <span class="text-xs bg-gray-800 border border-gray-700 px-2.5 py-1 rounded text-gray-300 font-mono">
                        Room: <strong x-text="roomId" class="text-indigo-400"></strong>
                    </span>
                </div>
            </header>

            <!-- Video Stage (Dynamic Grid vs Spotlight) -->
            <main class="flex-1 p-4 overflow-y-auto flex items-center justify-center relative">
                
                <!-- MODE 1: GRID VIEW (When nobody is pinned) -->
                <div x-show="!pinnedPeer" 
                     class="w-full h-full grid gap-4 auto-rows-fr"
                     :class="{
                         'grid-cols-1 max-w-4xl': peers.length === 1,
                         'grid-cols-2 max-w-6xl': peers.length === 2 || peers.length === 3,
                         'grid-cols-2 md:grid-cols-2 max-w-6xl': peers.length >= 4
                     }">
                    
                    <template x-for="peer in peers" :key="peer.id">
                        <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden relative group shadow-lg flex items-center justify-center">
                            <!-- Video Element bound directly to stream -->
                            <video x-init="if(peer.stream) { $el.srcObject = peer.stream; $el.muted = peer.isLocal; }" 
                            autoplay playsinline :muted="peer.isLocal" 
                            class="w-full h-full object-contain bg-black"></video>
                            
                            <!-- Overlay Info Bar -->
                            <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between pointer-events-none">
                                <span class="bg-black/60 backdrop-blur px-2.5 py-1 rounded text-xs font-medium flex items-center space-x-1.5">
                                    <span x-text="peer.name"></span>
                                    <span x-show="peer.isLocal" class="text-indigo-400 text-[10px]">(You)</span>
                                </span>
                                <div class="flex space-x-1 pointer-events-auto opacity-0 group-hover:opacity-100 transition-opacity">
                                    <!-- Pin Button -->
                                    <button @click="pinPeer(peer)" title="Pin to Stage" 
                                            class="p-1.5 bg-black/60 hover:bg-indigo-600 rounded text-xs backdrop-blur transition">
                                        📌 Pin
                                    </button>
                                    <!-- Fullscreen Button -->
                                    <button @click="window.document.fullscreenElement ? window.document.exitFullscreen() : $el.closest('.group').requestFullscreen()" title="Fullscreen" 
                                            class="p-1.5 bg-black/60 hover:bg-gray-700 rounded text-xs backdrop-blur transition">
                                        ⛶
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- MODE 2: SPOTLIGHT VIEW (When a screen share or user is pinned) -->
                <div x-show="pinnedPeer" class="w-full h-full flex flex-col md:flex-row gap-4">
                    
                    <!-- Main Pinned Stage -->
                    <div class="flex-1 bg-gray-900 border border-gray-800 rounded-xl overflow-hidden relative group flex items-center justify-center">
                        <video x-init="$watch('pinnedPeer', val => { if(val && val.stream) { $el.srcObject = val.stream; $el.muted = val.isLocal; } })" 
                        autoplay playsinline :muted="pinnedPeer?.isLocal" 
                        class="w-full h-full object-contain bg-black"></video>
                        
                        <div class="absolute top-4 left-4 z-10 flex space-x-2">
                            <button @click="pinnedPeer = null" 
                                    class="bg-black/70 hover:bg-red-600/80 backdrop-blur px-3 py-1.5 rounded text-xs font-semibold flex items-center space-x-1 border border-gray-700 transition">
                                <span>⬅ Back to Grid</span>
                            </button>
                            <span class="bg-indigo-600/80 backdrop-blur px-3 py-1.5 rounded text-xs font-semibold flex items-center border border-indigo-500">
                                <span>Spotlight: <strong x-text="pinnedPeer?.name"></strong></span>
                            </span>
                        </div>
                        
                        <button @click="window.document.fullscreenElement ? window.document.exitFullscreen() : $el.closest('.group').requestFullscreen()" 
                                class="absolute bottom-4 right-4 z-10 p-2 bg-black/60 hover:bg-gray-700 border border-gray-700 rounded-lg text-sm backdrop-blur opacity-0 group-hover:opacity-100 transition">
                            ⛶
                        </button>
                    </div>

                    <!-- Side/Bottom Strip for other Webcams -->
                    <div class="w-full md:w-64 flex md:flex-col gap-3 overflow-x-auto md:overflow-y-auto max-h-48 md:max-h-full shrink-0">
                        <template x-for="peer in peers" :key="peer.id">
                            <div @click="pinPeer(peer)" 
                                 class="w-40 md:w-full h-28 md:h-36 bg-gray-900 border rounded-lg overflow-hidden relative cursor-pointer group shrink-0 transition"
                                 :class="pinnedPeer?.id === peer.id ? 'border-indigo-500 ring-2 ring-indigo-500/50' : 'border-gray-800 hover:border-gray-600'">
                                <video x-init="if(peer.stream) { $el.srcObject = peer.stream; $el.muted = peer.isLocal; }" 
                                autoplay playsinline :muted="peer.isLocal" 
                                class="w-full h-full object-cover bg-black pointer-events-none"></video>
                                <div class="absolute bottom-1.5 left-1.5 bg-black/60 px-1.5 py-0.5 rounded text-[10px] truncate max-w-[90%]">
                                    <span x-text="peer.name"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            </main>

            <!-- Bottom Control Bar -->
            <footer class="h-20 border-t border-gray-800 bg-gray-900/80 backdrop-blur px-6 flex items-center justify-between z-10">
                <!-- Media Toggles -->
                <div class="flex items-center space-x-3">
                    <button @click="toggleMic()" 
                            class="p-3.5 rounded-xl font-medium flex items-center justify-center transition border shadow-sm"
                            :class="isMuted ? 'bg-red-500/10 border-red-500/20 text-red-500 hover:bg-red-500/20' : 'bg-gray-800 border-gray-700 hover:bg-gray-700 text-gray-200'">
                        <span x-text="isMuted ? '🔇 Muted' : '🎙️ Mic On'"></span>
                    </button>
                    <button @click="toggleCam()" 
                            class="p-3.5 rounded-xl font-medium flex items-center justify-center transition border shadow-sm"
                            :class="isCamOff ? 'bg-red-500/10 border-red-500/20 text-red-500 hover:bg-red-500/20' : 'bg-gray-800 border-gray-700 hover:bg-gray-700 text-gray-200'">
                        <span x-text="isCamOff ? '🚫 Cam Off' : '📹 Cam On'"></span>
                    </button>
                </div>

                <!-- Stream / Screen Share Controls -->
                <div class="flex items-center space-x-3">
                    <button @click="toggleScreenShare()" 
                            class="px-6 py-3.5 rounded-xl font-semibold flex items-center space-x-2 transition border shadow-lg"
                            :class="isSharingScreen ? 'bg-amber-600 border-amber-500 hover:bg-amber-500 text-white animate-pulse' : 'bg-indigo-600 border-indigo-500 hover:bg-indigo-500 text-white'">
                        <span x-text="isSharingScreen ? '🖥️ Stop Streaming' : '🚀 Share Screen / Stream'"></span>
                    </button>
                </div>

                <!-- Right Utilities (Chat Toggle, Leave) -->
                <div class="flex items-center space-x-3">
                    <button @click="isChatOpen = !isChatOpen" 
                            class="p-3.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-xl relative transition">
                        💬 Chat
                        <span x-show="unreadCount > 0" x-text="unreadCount" 
                              class="absolute -top-1.5 -right-1.5 bg-indigo-600 text-white font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-gray-900"></span>
                    </button>
                    <button @click="leaveRoom()" class="p-3.5 bg-red-600/80 hover:bg-red-600 border border-red-500/50 text-white font-semibold rounded-xl transition">
                        📞 Leave
                    </button>
                </div>
            </footer>
        </div>

        <!-- Right Sidebar: Sliding P2P Chat Drawer -->
        <aside x-show="isChatOpen" 
               x-transition:enter="transition ease-out duration-200" 
               x-transition:enter-start="translate-x-full" 
               x-transition:enter-end="translate-x-0"
               x-transition:leave="transition ease-in duration-150" 
               x-transition:leave-start="translate-x-0" 
               x-transition:leave-end="translate-x-full"
               class="w-80 border-l border-gray-800 bg-gray-900 flex flex-col h-full z-20 absolute right-0 top-0 bottom-0 shadow-2xl">
            
            <div class="h-14 border-b border-gray-800 px-4 flex items-center justify-between">
                <h3 class="font-bold text-sm text-gray-300 flex items-center space-x-2">
                    <span>⚡ P2P Direct Chat</span>
                </h3>
                <button @click="isChatOpen = false" class="text-gray-400 hover:text-white p-1">✕</button>
            </div>

            <!-- Message Feed -->
            <div class="flex-1 p-4 overflow-y-auto space-y-3 font-sans text-sm">
                <template x-for="msg in messages" :key="msg.id">
                    <div class="flex flex-col" :class="msg.isSelf ? 'items-end' : 'items-start'">
                        <span class="text-[10px] text-gray-500 mb-0.5" x-text="msg.sender"></span>
                        <div class="max-w-[85%] rounded-2xl px-3.5 py-2 break-words"
                             :class="msg.isSelf ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-gray-800 text-gray-200 border border-gray-700/50 rounded-bl-none'">
                            <p x-text="msg.text"></p>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Chat Input -->
            <form @submit.prevent="sendMessage()" class="p-3 border-t border-gray-800 bg-gray-950/50 flex space-x-2">
                <input type="text" x-model="chatInput" placeholder="Send direct via DataChannel..." 
                       class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-2 rounded-lg text-sm font-semibold transition">
                    ➤
                </button>
            </form>
        </aside>

    </div>

    <!-- Application Logic -->
    <script src="client.js"></script>
</body>
</html>
